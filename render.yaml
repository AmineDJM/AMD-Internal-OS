# Render Blueprint — deploys the Next.js app (AMD Internal OS) + a managed
# PostgreSQL database.
#
# How to use:
#   1. In Render: New +  →  Blueprint  →  connect this GitHub repo.
#   2. IMPORTANT: select the branch  claude/hopeful-goodall-phd0nb
#   3. When prompted, set ADMIN_EMAIL and ADMIN_PASSWORD (your first login).
#   4. Apply. Render provisions Postgres, runs migrations, creates your admin,
#      builds and starts the app. No demo data — you fill it in.
#
# Notes:
#   - LES OFFRES ÉCRITES ICI SONT CELLES DE LA PRODUCTION (relevées par la Direction le 30/10/2026) : base
#     Basic-4gb, web Standard (1 CPU, 2 Go). Un Sync APPLIQUE l'offre du fichier : une offre plus basse ici rétrograderait le
#     service, et Render refuse de rétrograder une base (« cannot downgrade database from Basic-4gb to Free » —
#     le Sync entier échouait). Changer d'offre dans le tableau de bord ⇒ la reporter ici dans le même temps.

databases:
  - name: amd-postgres
    plan: basic-4gb
    databaseName: amd_internal_os

services:
  - type: web
    name: amd-internal-os
    runtime: node
    plan: standard
    # LA SONDE REGARDE LA BASE ET LES MIGRATIONS (audit 27/10, INFRA-05) : `/login` est statique et répondait 200,
    # même base perdue. `/api/health` rend 503 si Postgres ne répond pas ou si une migration du dépôt n'est pas
    # appliquée — le déploiement échoue au lieu de servir du code sur un schéma en retard. ⚠️ Le tableau de bord
    # Render prime (§118.208) : y reporter *Settings → Health Check Path* = /api/health.
    healthCheckPath: /api/health
    # Build installs deps, generates the client, LINTS (phase séparée, bloquante), typechecks and
    # builds Next.js, THEN applies migrations and creates the Super Admin (idempotent). Lint et typecheck vivent
    # dans DEUX processus : additionnés dans le même heap ils dépassaient la limite Node
    # par défaut (~2 Go) → OOM pendant « Linting and checking validity of types ».
    #
    # ⚠️ LE PLAFOND « over 8GB » DE RENDER EST UN PLAFOND DE CONTENEUR : il additionne les
    # processus ET les fichiers du workspace (node_modules 1,1 Go, cache npm, .next). C'est
    # pourquoi un build à cache FROID mourait quand le même commit passait à cache chaud.
    #
    # MÉMOIRE DE BUILD — mesures (`npm run build:measure`, build propre, 4 vCPU) :
    #   pic processus  3907 Mo → 3647 Mo   (.next écrit : 1109 Mo → 277 Mo, cache webpack
    #                                       984 Mo → 153 Mo compressé)
    # Trois causes bornées, toutes tenues par le dépôt :
    #   1. PARALLÉLISME dimensionné sur les cœurs du builder → borné (`experimental.cpus: 2`,
    #      workers statiques ET minification — vérifié dans la dist de Next 14.2.35).
    #   2. MINIFICATION SERVEUR (~1 Go de pic pour rien côté navigateur) → désactivée.
    #   3. CACHE WEBPACK retenu EN ENTIER dans le tas (`maxMemoryGenerations: Infinity` en
    #      prod) et écrit NON compressé (984 Mo) → `maxMemoryGenerations: 1` partout, et
    #      compression gzip quand `RENDER` est présent (next.config.mjs). Le cache
    #      inter-déploiements est conservé, juste plus petit et hors du tas.
    #   Node 20 (builder) vs Node 22 (dev) : MESURÉ neutre (3782 vs 3907 Mo) — hors de cause.
    #
    # ⚠️ NE PAS poser NODE_OPTIONS dans le dashboard Render : il s'appliquerait à TOUS les
    # processus du build (npm, prisma generate, bootstrap) en les autorisant à gonfler, ET au
    # runtime `next start` où une grande laisse V8 sur une petite instance provoque l'OOM
    # inverse. Les plafonds vivent ICI, phase par phase, dans build:render (lint 3072 Mo, compilation 3584 Mo depuis Next 15 — next.config.mjs, `TAS_DU_BUILD_MO`).
    #
    # ORDRE (refonte P0, docs/architecture/refonte-p0-outillage.md §2) : TOUT ce qui peut échouer
    # sans toucher la base passe AVANT `migrate deploy`. Avant, les migrations partaient en premier :
    # un lint, un typecheck ou une compilation en échec laissaient la production servir l'ANCIEN
    # code sur la base DÉJÀ migrée. `next build` n'ouvre aucune connexion (mesuré : build complet
    # réussi avec une DATABASE_URL injoignable ; seules /login et /_not-found sont statiques) — il
    # n'a donc pas besoin des migrations. `prisma generate` reste en tête : tsc et next build
    # compilent contre le client généré. Le bootstrap lit des tables : il suit les migrations.
    # ⚠️ Si le tableau de bord Render porte sa propre commande (§118.208), elle remplace celle-ci :
    # y recopier cette ligne à l'identique.
    # `npm ci` (audit 27/10, INFRA-09) : installe EXACTEMENT `package-lock.json`, échoue s'il diverge de
    # `package.json` — la CI fait de même ; le build déployé est celui qui a été vérifié.
    buildCommand: npm ci && npx prisma generate && npm run build:render && npx prisma migrate deploy && npm run db:bootstrap
    startCommand: npx next start -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amd-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # LES DEUX BATTENT (décision 0019, « cliquez Sync, c'est tout ») : le bail par tâche (table `TacheDeFond`) fait
      # qu'UN seul exécutant tient chaque tâche. Tant que le worker n'a pas battu (première construction, panne), le web
      # fait TOUT comme avant ; dès qu'il bat, le web lui laisse les travaux longs et les conversions.
      - key: TACHES_DE_FOND
        value: les-deux
      # La clé du fournisseur d'IA, posée à la main sur le web : déclarée ici pour que le worker la reçoive (`fromService`).
      # `sync: false` = le Blueprint ne touche jamais à la valeur déjà posée dans le tableau de bord.
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
      # Limites d'upload par DÉFAUT (repli si la ligne de réglages est absente). Généreuses :
      # un ZIP de dossier entier passe. Réglables ensuite en Administration (base fait foi).
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_DRIVE_UPLOAD_MB
        value: "1024"
      # STOCKAGE OBJET (Cloudflare R2 / AWS S3) — indispensable pour les gros fichiers : le
      # navigateur envoie alors les dossiers CTD de plusieurs Go DIRECTEMENT au bucket. Sans lui,
      # tout fichier de plus de MAX_DB_UPLOAD_MB est refusé (Postgres gratuit ≈ 1 Go).
      # Guide (bucket, règle CORS, test) : docs/stockage-gros-fichiers.md
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION # « auto » pour R2, la région pour AWS (ex. eu-west-3)
        sync: false
      - key: MAX_DB_UPLOAD_MB
        value: "100"
      # Your first login — set these in the Render dashboard when prompted.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Notifications push (PWA) — collez les 2 clés VAPID générées (sinon push inerte).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Publication vers le site public Adventum (offres d'emploi, articles) — §118.158.
      # ADVENTUM_API_KEY porte la MÊME valeur que ERP_API_KEY côté site (openssl rand -hex 32) :
      # elle donne le droit de publier sur le site public, elle ne vit QUE dans ce magasin de
      # secrets. Sans ces deux variables, la file et la réconciliation se taisent.
      - key: ADVENTUM_BASE_URL
        sync: false
      - key: ADVENTUM_API_KEY
        sync: false
      # Facultatif : signature HMAC-SHA256 du corps (même valeur que ERP_WEBHOOK_SECRET côté site).
      - key: ADVENTUM_WEBHOOK_SECRET
        sync: false

  # ───────────────────────────────────────────────────────────────────────────────────────────
  # ADVENTUM IA — L'APP DE L'ASSISTANT IA, SUR SON PROPRE SITE (décision 0027, 30/10/2026).
  #
  # Créé par le simple « Sync » du Blueprint : adresse https://adventum-ia-k3uc.onrender.com (Render suffixe les noms du Blueprint, comme le web ; le nom libre le plus proche
  # que Render attribue — le reporter alors dans AUTH_URL / APP_URL ci-dessous). MÊME dépôt, MÊME build que l'ERP ; la
  # variable APP_MODE=adventum-ia fait le reste (middleware, `src/platform/app-mode.ts`) : la racine ouvre l'app, une page de
  # l'ERP renvoie vers l'ERP (ERP_URL), une API de l'ERP est refusée. MÊME base, MÊMES comptes (AUTH_SECRET partagé),
  # mêmes droits. Il NE MIGRE PAS (seul le web ERP migre, après son lint et sa compilation) et ne bat pas les tâches de
  # fond (TACHES_DE_FOND=worker : le web ou le worker les tiennent). Procédure : docs/readme/24-deploiement-render.md.
  - type: web
    name: adventum-ia
    runtime: node
    # STANDARD (1 CPU, 2 Go), choix de la Direction du 31/10/2026 : en Starter (512 Mo) le serveur mourait au premier
    # contrôle de santé — l'assistant charge l'essentiel de l'ERP (ses ~1 280 actions) ; mesuré ≈ 600 Mo de RSS.
    plan: standard
    healthCheckPath: /api/health
    buildCommand: npm ci && npx prisma generate && npm run build:render
    startCommand: npx next start -p $PORT
    envVars:
      # LA CLÉ DES FICHIERS (31/10/2026) : le Drive, les contrats et pièces sont CHIFFRÉS avec DRIVE_ENCRYPTION_KEY, à défaut
      # NEXTAUTH_SECRET, à défaut AUTH_SECRET (`src/lib/drive-storage.ts`). Si le web porte l'une des deux premières, la
      # recopier ICI À L'IDENTIQUE — sinon tout fichier ouvert depuis ce service est illisible (« HTTP ERROR 500 »).
      - key: DRIVE_ENCRYPTION_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: APP_MODE
        value: adventum-ia
      - key: AUTH_URL
        value: https://adventum-ia-k3uc.onrender.com
      - key: APP_URL
        value: https://adventum-ia-k3uc.onrender.com
      # L'ERP, vers lequel une page de l'ERP ouverte sur l'app est renvoyée (sans elle : 404).
      - key: ERP_URL
        value: https://amd-internal-os-k3uc.onrender.com
      - key: TACHES_DE_FOND
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: amd-postgres
          property: connectionString
      - key: AUTH_SECRET
        fromService: { type: web, name: amd-internal-os, envVarKey: AUTH_SECRET }
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        fromService: { type: web, name: amd-internal-os, envVarKey: OPENAI_API_KEY }
      - key: MAX_UPLOAD_MB
        fromService: { type: web, name: amd-internal-os, envVarKey: MAX_UPLOAD_MB }
      - key: MAX_DRIVE_UPLOAD_MB
        fromService: { type: web, name: amd-internal-os, envVarKey: MAX_DRIVE_UPLOAD_MB }
      - key: MAX_DB_UPLOAD_MB
        fromService: { type: web, name: amd-internal-os, envVarKey: MAX_DB_UPLOAD_MB }
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # ───────────────────────────────────────────────────────────────────────────────────────────
  # LE WORKER (refonte V2-F ; image Docker J2 ; « CLIQUEZ SYNC, C'EST TOUT » : décision 0019, 30/10/2026).
  #
  # Même dépôt, autre point d'entrée : `tsx scripts/worker.ts` exécute la table des tâches de `src/lib/scheduled.ts`
  # (rappels, paie notifiée, jobs réglementaires, routines et fil de l'Assistant, missions, travaux longs, CONVERSIONS
  # de l'Atelier…), chaque tâche sous un BAIL en base (table `TacheDeFond`) : un seul exécutant la tient.
  #
  # LA DIRECTION CLIQUE « SYNC », RIEN D'AUTRE : la synchronisation CRÉE ce service (payant : Render n'a pas d'offre
  # gratuite pour un Background Worker), lui DONNE ses variables (ci-dessous, reliées au web), et il TRAVAILLE aussitôt
  # (TACHES_DE_FOND=les-deux, ici ET sur le web). Ce qui est vérifié tout seul :
  #   • au build de l'image : le moteur de conversion se déclare complet (Python, paquets, tesseract ara/fra/eng « best »,
  #     LibreOffice, polices) — sinon l'image n'est pas construite ;
  #   • au démarrage : le worker attend que la base porte les migrations de son commit (seul le web migre), puis
  #     CONTRÔLE ses variables et son moteur — chaque manque est écrit EN CLAIR dans le journal (`worker.controle`) et
  #     dans Administration › Diagnostic › « Worker et conversions » ;
  #   • en marche : GET /api/health/worker (exécutants récents), le même écran (dernier battement, file, échecs).
  # Retour arrière : suspendre le service (le web, en `les-deux`, reprend tout seul les tâches) — aucun code.
  #
  # LES VARIABLES (recensées dans le code du worker, `src/lib/taches-de-fond/controle.ts`) : chacune vient du web par
  # `fromService` — la MÊME valeur, sans recopie — pour les SEULES clés que le web porte à coup sûr (AUTH_SECRET,
  # OPENAI_API_KEY, limites d'upload). MESURÉ au Sync du 31/10/2026 : un `fromService` vers une clé absente du web
  # (« environment variable not found: "VAPID_SUBJECT" ») fait échouer TOUT le Sync. Les facultatives (S3, VAPID,
  # ADVENTUM_*) sont donc en `sync: false` : à recopier depuis le web si elles y sont posées. Un Sync en échec serait
  # pire qu'une clé manquante. Les autres (Google, Microsoft, Mistral, courriel) : le contrôle au démarrage les dit
  # absentes, en clair ; les ajouter ici le jour où elles sont posées sur le web (une ligne chacune, même forme).
  # APP_URL est littérale : Render ne donne RENDER_EXTERNAL_URL qu'aux services web.
  - type: worker
    name: amd-worker
    runtime: docker
    # STANDARD (1 CPU, 2 Go), choix de la Direction du 31/10/2026 : en Starter (512 Mo) le worker mourait au bout de
    # ~75 s (tas à ~256 Mo) ; mesuré stable à ≈ 520 Mo de RSS sur 3 minutes, toutes tâches de fond actives.
    plan: standard
    # Ni compilation Next (le worker ne sert aucune page) NI migration : seul le build du web migre, APRÈS son lint, son
    # typecheck et sa compilation (refonte P0). L'image démarre seule (`CMD` du Dockerfile : `tsx scripts/worker.ts`).
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    envVars:
      # LA CLÉ DES FICHIERS (31/10/2026) : le Drive, les contrats et pièces sont CHIFFRÉS avec DRIVE_ENCRYPTION_KEY, à défaut
      # NEXTAUTH_SECRET, à défaut AUTH_SECRET (`src/lib/drive-storage.ts`). Si le web porte l'une des deux premières, la
      # recopier ICI À L'IDENTIQUE — sinon tout fichier ouvert depuis ce service est illisible (« HTTP ERROR 500 »).
      - key: DRIVE_ENCRYPTION_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: TACHES_DE_FOND
        value: les-deux
      - key: APP_URL
        value: https://amd-internal-os-k3uc.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: amd-postgres
          property: connectionString
      # La clé maître : la MÊME que le web (coffre, secrets de connexion).
      - key: AUTH_SECRET
        fromService: { type: web, name: amd-internal-os, envVarKey: AUTH_SECRET }
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: OPENAI_API_KEY
        fromService: { type: web, name: amd-internal-os, envVarKey: OPENAI_API_KEY }
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_DRIVE_UPLOAD_MB
        value: "1024"
      - key: MAX_DB_UPLOAD_MB
        value: "100"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ADVENTUM_BASE_URL
        sync: false
      - key: ADVENTUM_API_KEY
        sync: false
      - key: ADVENTUM_WEBHOOK_SECRET
        sync: false
