# ═══════════════════════════════════════════════════════════════════════════════════════════
# CI — la porte que chaque commit doit franchir AVANT que Render ne le déploie.
#
# Jusqu'ici, la seule barrière était la discipline locale (CLAUDE.md : typecheck → build → test
# → lint) et le build de Render lui-même — qui échoue APRÈS avoir déjà appliqué les migrations
# (voir refonte/p0-outillage) et sans que personne ne soit prévenu. Ce pipeline rejoue la même
# séquence, à chaque push et chaque PR, sur une machine neuve (pas de cache `.next` trompeur) et
# contre un Postgres neuf (les 460+ migrations rejouées depuis zéro, ce qu'aucun poste ne fait).
#
# Trois jobs PARALLÈLES, chacun dans son propre conteneur — même raison que build:render : lint,
# typecheck et compilation additionnés dans un seul processus dépassent la mémoire.
#   verifier : migrations sur base vide · code mort / doublons · contrat des actions · typecheck · lint · npm audit (prod)
#              — sur un Postgres 16 NU (sans pgvector) : la migration de la bibliothèque (J1) doit y passer, et y passe
#   tests    : Vitest complet en 4 tranches, chacune contre son Postgres 16 AVEC pgvector (image pgvector/pgvector:pg16,
#              celle de la production) — le chemin vectoriel de la bibliothèque est éprouvé ; son repli plein texte
#              l'est aussi, forcé dans `src/modules/bibliotheque/bibliotheque.test.ts`
#   build    : `npm run build:render` à froid — la commande exacte du déploiement — puis le plafond
#              du JS de la coque (`npm run bundle:plafond`)
#
# Rien ici ne sort : aucune clé de fournisseur, ADAM_SORTIE_INTERDITE=1, base locale au runner.
# Audit 27/10/2026 — docs/audit/2026-10-27/10-infra-ci-observabilite.md (INFRA-01).
# ═══════════════════════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, "claude/**", "refonte/**", "audit/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Même URL que le défaut de `npm test` : le garde de prisma.ts exige un hôte local.
  DATABASE_URL: postgresql://amd:amd@localhost:5432/amd_internal_os
  TEST_DATABASE_URL: postgresql://amd:amd@localhost:5432/amd_internal_os
  AUTH_SECRET: ci-secret-non-utilise-en-production-0123456789abcdef
  ADAM_SORTIE_INTERDITE: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  verifier:
    name: Migrations · code mort · contrat · typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amd
          POSTGRES_PASSWORD: amd
          POSTGRES_DB: amd_internal_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amd" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Les migrations, rejouées sur une base VIDE : un SQL non idempotent ou mal ordonné échoue
      # ici et non pendant le déploiement.
      - run: npx prisma migrate deploy
      # LA BIBLIOTHÈQUE SANS pgvector (J1) : ce Postgres n'a pas l'extension — la migration est passée, et elle n'a
      # posé ni colonne `vecteur` ni index HNSW (le code retombe sur plein texte + trigrammes).
      - name: Bibliothèque — la migration passe sans pgvector
        run: |
          echo "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'BibliothequePassage') OR EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'BibliothequePassage' AND column_name = 'vecteur') THEN RAISE EXCEPTION 'migration bibliotheque inattendue sans pgvector'; END IF; END \$\$;" | npx prisma db execute --stdin --url "$DATABASE_URL"
      # La dérive schéma ↔ base (558 lignes de `prisma migrate diff` au 27/10) est tenue par le
      # test-cliquet de refonte/p0-outillage (src/lib/derive-schema/), qui tourne dans `tests`.
      - run: npm run db:bootstrap
      # Code mort et doublons, mesurés par knip et jscpd (audit 08, ARCH-06) : zéro fichier, export,
      # type ou dépendance inutilisé ; doublons sous leur plafond. Plafonds et exceptions nommées :
      # `src/platform/qualite-code.ts` (tenus aussi par `qualite-code.test.ts`, dans `tests`).
      - run: npm run qualite:mort
      - run: npm run qualite:doublons
      # Contrat des server actions : le fichier généré est-il celui du code ?
      - name: Contrat des actions à jour
        run: |
          npm run actions:contrat
          git diff --exit-code -- src/lib/actions/
      # Les deux typechecks : complet (tests, scripts, e2e) et celui du build de production.
      - run: npm run typecheck
        env: { NODE_OPTIONS: --max-old-space-size=6144 }
      - run: npx tsc --noEmit -p tsconfig.build.json
        env: { NODE_OPTIONS: --max-old-space-size=6144 }
      # Render lance `next lint` AVANT le build (build:render) : une erreur bloque le déploiement.
      - run: npx next lint
        env: { NODE_OPTIONS: --max-old-space-size=3072 }
      # Dépendances de PRODUCTION : aucun avis critique ni haut (audit 27/10, INFRA-03 — fermé par la
      # montée Next 15 / next-auth beta.32 / xlsx CDN, lot V3-A). Bloquant : un nouvel avis se traite
      # (montée, `overrides` dans package.json) avant de déployer. Les outils de test (--omit=dev)
      # ne partent jamais en production.
      - name: npm audit (production, critique/haut)
        run: npm audit --omit=dev --audit-level=high

  tests:
    name: Vitest ${{ matrix.shard }}/4 (Postgres 16)
    runs-on: ubuntu-latest
    # MESURÉ (27/10) : la suite complète (1 270 fichiers, 14 745 tests) prend 12 min 30 sur 4 cœurs,
    # environ le double sur un runner privé à 2 vCPU. Quatre tranches parallèles, chacune avec SON
    # Postgres (les décors ne se marchent pas dessus), ramènent le retour à quelques minutes.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 60
    services:
      postgres:
        # pgvector (approuvé en production, décision J1 du 29/10/2026) : la colonne `vecteur` et son index HNSW
        # existent, le chemin hybride de la recherche est testé. Le chemin SANS extension : job `verifier`.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: amd
          POSTGRES_PASSWORD: amd
          POSTGRES_DB: amd_internal_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amd" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Sans base, 400 fichiers de tests se SAUTENT en silence (`dbOk ? describe : describe.skip`) :
      # on prouve qu'elle répond avant de lancer la suite.
      - name: La base répond (sinon les suites DB se sauteraient)
        run: echo "SELECT 1" | npx prisma db execute --stdin --url "$DATABASE_URL"
      # Et elle porte pgvector : la colonne `vecteur` de la bibliothèque existe (le chemin hybride est éprouvé).
      - name: Bibliothèque — pgvector présent
        run: |
          echo "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'BibliothequePassage' AND column_name = 'vecteur') THEN RAISE EXCEPTION 'pgvector absent du Postgres des tests'; END IF; END \$\$;" | npx prisma db execute --stdin --url "$DATABASE_URL"
      - run: npm test -- --shard=${{ matrix.shard }}/4
        env: { NODE_OPTIONS: --max-old-space-size=4096 }

  build:
    name: Build de production (build:render, à froid)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Pas de cache `.next` restauré, volontairement : CLAUDE.md — un build à cache chaud peut
      # rater l'erreur « Can't resolve 'fs' » que Render, parti d'un dossier vide, verra.
      # `next build` n'ouvre aucune connexion à la base (mesuré, refonte P0) : pas de service ici.
      - run: npm run build:render
      # LE POIDS DE LA COQUE (audit performance PERF-05) : le JS que paie CHAQUE page. Plafond dans
      # `scripts/mesure-bundle.mjs` (PLAFOND_COQUE_KB) — un import « tout le module » qui revient échoue ici.
      - name: Plafond du JS de la coque
        run: npm run bundle:plafond
