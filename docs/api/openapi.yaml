"openapi": "3.1.0"
"info": 
  "title": "AMD Internal OS — API pour agents"
  "version": "1.0.0"
  "description": |-
      API machine de l'ERP interne d'Adventum Pharma (groupe pharmaceutique algérien).
      
      **Deux couches d'autorisation, toujours cumulées.** Les *portées* (scopes) disent ce que l'intégration a le droit de faire ; l'*identité* au nom de laquelle l'agent agit dit ce qu'elle voit dans l'ERP. Un agent ne dépasse jamais ni l'une ni l'autre.
      
      **L'API n'a pas de logique propre.** Elle appelle les mêmes fonctions métier et les mêmes gardes que les écrans : ce qui est interdit à l'écran l'est ici, et pour la même raison.
      
      **Par où commencer** : `list_modules` (ce que je peux), puis `search_erp` (trouver), puis `get_{objet}_workflow` (où en est-on, qu'est-ce qui bloque).
  "contact": 
    "name": "Adventum Pharma — Administration AMD Internal OS"
"servers": 
  -     "url": "https://amd-internal-os-k3uc.onrender.com"
    "description": "Production"
"paths": 
  "/api/v1/meta/modules": 
    "get": 
      "operationId": "list_modules"
      "summary": "Lister les modules de l'ERP et ce que cette identité peut y faire"
      "description": "Point de départ d'un agent. Rend les modules réels, les droits EFFECTIFS de l'identité au nom de laquelle l'agent agit (action par action), les portées accordées au client, et les objets exposés par module."
      "tags": 
        - "Découverte"
      "security": 
        -           "apiKey": 
            - "erp.read"
      "responses": 
        "200": 
          "description": "Modules et droits effectifs."
          "content": 
            "application/json": 
              "schema": 
                "type": "object"
        "401": 
          "description": "Clé absente, inconnue ou expirée."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/Error"
        "403": 
          "description": "Portée insuffisante, ou droit refusé à l'identité au nom de laquelle l'agent agit."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/Error"
        "404": 
          "description": "Objet introuvable — ou hors de la portée de cette identité."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/Error"
        "422": 
          "description": "Requête invalide (filtre inconnu, corps illisible…)."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/Error"
        "500": 
          "description": "Erreur interne."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/Error"
