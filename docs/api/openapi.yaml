    "get": 
      "operationId": "list_document"
      "summary": "Lister : Document"
      "description": |-
          Pièce jointe rattachée à un objet métier (facture, scan, rapport). Le contenu se télécharge par un point d'accès dédié, jamais par un chemin de fichier.
          
          Filtres possibles sur : id, name, category, entityType, entityId, stepKey, mimeType, sizeBytes, version, confidentiality, uploadedById, createdAt. Syntaxe : `champ=valeur`, `champ=in:A,B`, `champ=gte:2026-01-01`, `champ=contains:texte`, `champ=null`.
      "tags": 
        - "DOCUMENTS"
      "security": 
        -           "apiKey": 
            - "erp.read"
      "parameters": 
        -           "name": "q"
          "in": "query"
          "schema": 
            "type": "string"
          "description": "Recherche plein texte sur : name."
        -           "name": "sort"
          "in": "query"
          "schema": 
            "type": "string"
          "description": "Tri « champ:asc » ou « champ:desc »."
        -           "name": "limit"
          "in": "query"
          "schema": 
            "type": "integer"
            "minimum": 1
            "maximum": 500
            "default": 50
          "description": "Taille du lot (max 500)."
        -           "name": "offset"
          "in": "query"
          "schema": 
            "type": "integer"
            "minimum": 0
            "default": 0
          "description": "Décalage pour la page suivante."
      "responses": 
        "200": 
          "description": "Liste paginée de document."
          "content": 
