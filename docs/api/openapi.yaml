"components": 
  "securitySchemes": 
    "apiKey": 
      "type": "http"
      "scheme": "bearer"
      "description": |-
          Clé machine : `Authorization: Bearer amd_sk_…`. Émise par l'administration, rattachée à une identité et à des portées, révocable indépendamment des comptes humains.
          
          Portées : `erp.read` — Lire les objets, leurs relations, leur historique et leurs workflows. Aucune écriture. · `erp.search` — Interroger la recherche globale et les listes filtrées. · `erp.write` — Créer et modifier des objets métier (hors validation et administration). · `erp.documents.read` — Lister les pièces jointes et télécharger leur contenu. · `erp.documents.write` — Téléverser une pièce jointe et la rattacher à un objet. · `erp.workflow.execute` — Faire avancer un circuit : soumettre, transmettre, exécuter une étape. · `erp.approve` — Décider une validation (approuver / refuser). Séparé de `erp.write` à dessein. · `erp.admin` — Administration : comptes, droits, réglages, purge. À n'accorder qu'exceptionnellement.
          
          Profil LECTURE SEULE recommandé : erp.read, erp.search, erp.documents.read.
  "schemas": 
    "Error": 
      "type": "object"
      "required": 
        - "error"
      "properties": 
        "error": 
          "type": "object"
          "required": 
            - "code"
            - "message"
          "properties": 
            "code": 
              "type": "string"
              "enum": 
                - "UNAUTHENTICATED"
                - "INVALID_KEY"
                - "KEY_EXPIRED"
                - "CLIENT_DISABLED"
                - "MISSING_SCOPE"
                - "FORBIDDEN"
                - "NOT_FOUND"
                - "METHOD_NOT_ALLOWED"
                - "CONFLICT"
                - "IDEMPOTENCY_MISMATCH"
                - "VERSION_CONFLICT"
                - "VALIDATION_FAILED"
                - "RATE_LIMITED"
                - "INTERNAL"
              "description": "Code stable — c'est lui qu'un agent doit tester, pas le message."
            "message": 
              "type": "string"
            "hint": 
              "type": "string"
              "description": "Ce qu'il faut faire pour lever l'erreur."
            "requiredScopes": 
              "type": "array"
              "items": 
                "type": "string"
            "fields": 
              "type": "object"
              "additionalProperties": 
                "type": "string"
            "correlationId": 
              "type": "string"
              "description": "À citer pour retrouver l'appel exact dans le journal."
    "ListResult": 
      "type": "object"
      "required": 
        - "items"
        - "page"
      "properties": 
        "items": 
          "type": "array"
          "items": 
            "type": "object"
        "page": 
          "type": "object"
          "properties": 
            "limit": 
              "type": "integer"
            "offset": 
              "type": "integer"
            "total": 
              "type": "integer"
              "description": "Total DANS LA PORTÉE de l'identité — jamais le total absolu."
            "hasMore": 
              "type": "boolean"
"security": 
  -     "apiKey": []
