  "/api/v1/entities/regulatory_dossier": 
    "get": 
      "operationId": "list_regulatory_dossier"
      "summary": "Lister : Dossier réglementaire"
      "description": |-
          Un produit (DCI, dosage, forme, conditionnement) suivi jusqu'à sa décision d'enregistrement (DE) auprès de l'ANPP. C'est l'objet central du module Regulatory : il porte le workflow en 17 étapes, le processus officiel ANPP, les variations de fabrication, les pièces et les demandes de bon de virement.
          
          Filtres possibles sur : id, reference, dci, brandName, dosage, dosageUnit, pharmaceuticalForm, packaging, status, priority, manufacturingStatus, responsibleId, companyId, targetDate, updatedAt, therapeuticClass, comments. Syntaxe : `champ=valeur`, `champ=in:A,B`, `champ=gte:2026-01-01`, `champ=contains:texte`, `champ=null`.
      "tags": 
        - "REGULATORY"
      "security": 
        -           "apiKey": 
            - "erp.read"
      "parameters": 
        -           "name": "q"
          "in": "query"
          "schema": 
            "type": "string"
          "description": "Recherche plein texte sur : reference, dci, brandName, therapeuticClass, comments."
        -           "name": "sort"
          "in": "query"
          "schema": 
            "type": "string"
          "description": "Tri « champ:asc » ou « champ:desc »."
        -           "name": "limit"
          "in": "query"
          "schema": 
            "type": "integer"
            "minimum": 1
            "maximum": 500
            "default": 50
          "description": "Taille du lot (max 500)."
        -           "name": "offset"
          "in": "query"
          "schema": 
            "type": "integer"
            "minimum": 0
            "default": 0
          "description": "Décalage pour la page suivante."
      "responses": 
        "200": 
          "description": "Liste paginée de dossier réglementaire."
          "content": 
            "application/json": 
              "schema": 
                "$ref": "#/components/schemas/ListResult"
        "401": 
          "description": "Clé absente, inconnue ou expirée."
          "content": 
